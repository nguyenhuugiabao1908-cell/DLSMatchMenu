<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>DLS Match Tools • Bản xem thử</title>
<style>
:root{color-scheme:dark;--ink:#f1f8ff;--sub:#adbdcf;--line:#315467}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#07101c;color:var(--ink);overflow:hidden;-webkit-tap-highlight-color:transparent}
.scene{height:100dvh;min-height:400px;position:relative;overflow:hidden;background:radial-gradient(ellipse at 75% 8%,#17394b 0%,transparent 46%),radial-gradient(ellipse at 28% 92%,#101c40 0%,transparent 48%),#07101c;touch-action:pan-y}
.pitch{position:absolute;left:50%;top:50%;height:min(74vh,630px);width:min(80vw,370px);transform:translate(-50%,-50%) rotate(-10deg);border:1.5px solid #5a9bab24;pointer-events:none}
.pitch::before{content:"";position:absolute;top:50%;left:0;right:0;border-top:1.5px solid #5a9bab24}
.pitch::after{content:"";position:absolute;left:50%;top:50%;width:90px;height:90px;border:1.5px solid #5a9bab24;border-radius:50%;transform:translate(-50%,-50%)}
.water{background:linear-gradient(120deg,#277cdb,#21c9d7,#39d6ab,#6655df,#248fdb,#21c9d7);background-size:320% 320%;animation:waterFlow 5.2s ease-in-out infinite alternate}
@keyframes waterFlow{0%{background-position:0 15%}100%{background-position:100% 85%}}
.orb{position:absolute;left:18px;top:23%;width:62px;height:62px;padding:0;border-radius:50%;border:2px solid #9ceee3a0;color:#fff;display:grid;place-items:center;font-size:27px;cursor:grab;user-select:none;-webkit-user-select:none;touch-action:none;box-shadow:0 0 20px #27c0dd70,0 0 0 5px #2cabcc24;z-index:30}
.orb:active{cursor:grabbing}.orb:focus-visible{outline:3px solid #fff;outline-offset:4px}
.panel{position:absolute;top:50%;left:50%;width:min(292px,calc(100vw - 36px));transform:translate(-50%,-48%) scale(.94);padding:18px;border-radius:20px;border:1px solid #38667f;background:linear-gradient(140deg,#13263a 0%,#0b1323 100%);box-shadow:0 28px 80px #000a,0 0 35px #1cd6de11;visibility:hidden;opacity:0;pointer-events:none;transition:opacity .16s ease,transform .16s ease,visibility .16s;z-index:20}
.panel.open{visibility:visible;opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
.head{display:flex;justify-content:space-between;align-items:center;padding-bottom:12px;border-bottom:1px solid #2b4558}.name{font-size:15px;font-weight:750;letter-spacing:.035em}.version{font-size:10px;color:#7c9cb1}
.status{padding:13px 0 16px;display:flex;align-items:center;gap:9px;font-size:12px;color:#c0d3df}.dot{width:8px;height:8px;border-radius:50%;background:#ffbd61;box-shadow:0 0 10px #ffc16c55;flex:none}
.action{display:block;width:100%;border:none;color:white;border-radius:12px;padding:14px 12px;font-size:14px;font-weight:720;text-align:center;cursor:pointer;text-shadow:0 1px 3px #0005;box-shadow:0 6px 20px #0004}
.action+.action{margin-top:10px}.action:active{transform:scale(.98)}
.small{font-size:10px;letter-spacing:.08em;margin-top:14px;text-align:center;color:#78b2bb}
.hint{position:absolute;bottom:max(21px,env(safe-area-inset-bottom));width:100%;left:0;text-align:center;color:#94b0c2;font-size:12px;padding:0 20px;pointer-events:none}
.toast{position:absolute;z-index:40;left:50%;bottom:92px;max-width:calc(100vw - 36px);width:max-content;transform:translate(-50%,12px);padding:12px 15px;background:#152d39;border:1px solid #398f94;border-radius:13px;box-shadow:0 8px 30px #0007;color:#e3f9f9;font-size:12px;text-align:center;opacity:0;pointer-events:none;transition:opacity .18s,transform .18s}
.toast.show{transform:translate(-50%,0);opacity:1}
@media (prefers-reduced-motion:reduce){.water{animation:none}}
</style>
</head>
<body>
<main class="scene" id="scene">
  <div class="pitch"></div>
  <button class="orb water" id="orb" type="button" aria-label="Mở hoặc đóng menu" aria-controls="panel" aria-expanded="false">⚽</button>
  <section class="panel" id="panel" aria-hidden="true">
    <header class="head"><div class="name">DLS / MATCH TOOLS</div><div class="version">v1.1</div></header>
    <div class="status"><span class="dot"></span><span>Anti: chưa kết nối (bản demo)</span></div>
    <button class="action water" id="end" type="button">⏱ &nbsp; KẾT THÚC TRẬN</button>
    <button class="action water" id="goal" type="button">⚽ &nbsp; +1 BÀN THẮNG</button>
    <div class="small">GIAO DIỆN DEMO · CHƯA KẾT NỐI GAME</div>
  </section>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div class="hint">Chạm nút ⚽ để mở/đóng menu · Giữ và kéo để di chuyển</div>
</main>
<script>
(function(){
  'use strict';
  const orb = document.getElementById('orb');
  const panel = document.getElementById('panel');
  const scene = document.getElementById('scene');
  const toast = document.getElementById('toast');
  let point=null, dragged=false, suppressClick=false, toastTimer;
  function setOpen(value){
    panel.classList.toggle('open',value);
    panel.setAttribute('aria-hidden',String(!value));
    orb.setAttribute('aria-expanded',String(value));
  }
  function showToast(message){
    toast.textContent=message; toast.classList.add('show');
    clearTimeout(toastTimer); toastTimer=setTimeout(()=>toast.classList.remove('show'),2400);
  }
  function start(x,y,id){point={x,y,left:orb.offsetLeft,top:orb.offsetTop,id};dragged=false;}
  function move(x,y){
    if(!point)return;
    const dx=x-point.x,dy=y-point.y;
    if(Math.hypot(dx,dy)>7)dragged=true;
    if(!dragged)return;
    const area=scene.getBoundingClientRect();
    const left=Math.max(8,Math.min(area.width-orb.offsetWidth-8,point.left+dx));
    const top=Math.max(8,Math.min(area.height-orb.offsetHeight-8,point.top+dy));
    orb.style.left=left+'px';orb.style.top=top+'px';
  }
  function finish(){if(!point)return;if(dragged)suppressClick=true;point=null;dragged=false;}
  orb.addEventListener('click',e=>{
    if(suppressClick){suppressClick=false;return;}
    setOpen(!panel.classList.contains('open'));
  });
  if('PointerEvent' in window){
    orb.addEventListener('pointerdown',e=>{
      if(e.pointerType==='mouse' && e.button!==0)return;
      start(e.clientX,e.clientY,e.pointerId);
      if(orb.setPointerCapture)orb.setPointerCapture(e.pointerId);
    });
    orb.addEventListener('pointermove',e=>{if(point&&e.pointerId===point.id)move(e.clientX,e.clientY)});
    orb.addEventListener('pointerup',e=>{if(point&&e.pointerId===point.id)finish()});
    orb.addEventListener('pointercancel',()=>{point=null;dragged=false});
  }else{
    orb.addEventListener('touchstart',e=>{const t=e.touches[0];start(t.clientX,t.clientY,'touch')},{passive:true});
    orb.addEventListener('touchmove',e=>{if(!point)return;const t=e.touches[0];move(t.clientX,t.clientY);if(dragged)e.preventDefault()},{passive:false});
    orb.addEventListener('touchend',e=>{if(dragged)e.preventDefault();finish()},{passive:false});
    orb.addEventListener('mousedown',e=>{start(e.clientX,e.clientY,'mouse')});
    document.addEventListener('mousemove',e=>{if(point&&point.id==='mouse')move(e.clientX,e.clientY)});
    document.addEventListener('mouseup',()=>{if(point&&point.id==='mouse')finish()});
  }
  document.getElementById('end').addEventListener('click',()=>showToast('Demo: chưa kết nối hàm kết thúc trận'));
  document.getElementById('goal').addEventListener('click',()=>showToast('Demo: chưa kết nối hàm ghi bàn'));
})();
</script>
</body>
</html>
